<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio de Problemas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Erect%7Bfill:%23111%7Dpath%7Bstroke:%23fff%7Dcircle%7Bfill:%23fff%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23fff%7Dpath%7Bstroke:%23111%7Dcircle%7Bfill:%23111%7D%7D%3C/style%3E%3Crect width='32' height='32' rx='7'/%3E%3Cpath d='M10 12a6 6 0 1 1 9.4 4.9c-2.2 1.5-3.4 2.5-3.4 4.6' fill='none' stroke-width='4.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='26.6' r='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --fundo: #fff;
    --solido: #fff;
    --tinta: #111;
    --suave: #6b6b6b;
    --linha: #e4e4e4;
    --campo: #8a8a8a;
    --destaque: #111;
    --sobre-destaque: #fff;
    --ok: #1f7a4d;
    --sombra: rgba(0, 0, 0, .12);
    --titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #111;
      --solido: #1c1c1c;
      --tinta: #f2f2f2;
      --suave: #a0a0a0;
      --linha: #303030;
      --campo: #7a7a7a;
      --destaque: #f2f2f2;
      --sobre-destaque: #111;
      --ok: #5ccb93;
      --sombra: rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--tinta);
    font: 16px/1.55 var(--titulo);
    font-weight: 400;
  }
  main { padding-bottom: 72px; }
  .palco { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 20px; padding: clamp(16px, 2.5vw, 32px); }
  .cabecalho { display: flex; justify-content: space-between; align-items: center; gap: 16px 32px; }
  .cabecalho button { flex: none; }
  .palco:has(.bilhete.girando) .cabecalho { display: none; }
  .palco:has(.bilhete:not(.em-branco)) h1 { font-size: clamp(1.6rem, 2.6vw, 2.4rem); letter-spacing: -.025em; }
  h1 { font-size: clamp(1.7rem, 3.6vw, 3.6rem); font-weight: 800; line-height: 1.05; letter-spacing: -.03em; margin: 0; }
  h2 { font-size: 1.25rem; font-weight: 800; margin: 0 0 12px; }
  .rotulo { font: 500 .75rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }

  #painel-filtros {
    position: fixed; inset: 88px clamp(16px, 2.5vw, 32px) auto auto; margin: 0;
    width: min(340px, calc(100vw - 32px)); padding: 20px;
    background: var(--solido); color: var(--tinta);
    border: 1px solid var(--linha); border-radius: 14px; box-shadow: 0 20px 50px var(--sombra);
  }
  #painel-filtros:popover-open { display: grid; gap: 14px; }
  #contagem { font: 400 .8rem var(--mono); color: var(--suave); margin: 0; }
  label { display: block; }
  select, input, textarea {
    width: 100%; margin-top: 4px; padding: 10px 12px;
    background: var(--solido); color: var(--tinta);
    border: 1px solid var(--campo); border-radius: 8px;
    font: 500 1rem var(--titulo);
  }
  textarea { resize: vertical; min-height: 76px; }

  .bilhete { flex: 1; display: flex; flex-direction: column; }
  .em-branco .bilhete-corpo { align-items: center; text-align: center; padding: 0 0 80px; }
  .palco:has(.bilhete.em-branco:not(.girando)) .cabecalho { display: none; }
  .frase-area { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  button.lapis {
    position: relative; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; opacity: 0;
  }
  button.lapis svg { width: 22px; height: 22px; }
  button.lapis.ligado { opacity: 1; }
  button.lapis.ligado::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--tinta); }
  .frase-area:hover .lapis, .frase-area:focus-within .lapis { opacity: 1; }
  button.titulo-link, button.titulo-link:hover:not(:disabled) { font: inherit; letter-spacing: inherit; color: inherit; text-align: left; padding: 0; border: 0; background: transparent; }
  button.titulo-link { transform-origin: left center; }
  button.titulo-link:hover:not(:active) { transform: scale(1.05); }
  @media (prefers-reduced-motion: reduce) { button.titulo-link:hover:not(:active) { transform: none; } }
  .frase { margin: 0; font: inherit; }
  button.frase-botao, button.frase-botao:hover:not(:disabled) { display: block; padding: 0; border: 0; background: transparent; color: var(--tinta); text-align: center; }
  .frase-texto {
    display: block; max-width: 11ch; margin: 0 auto;
    font-size: clamp(2.6rem, min(9vw, 18dvh), 9rem); font-weight: 800; line-height: 1; letter-spacing: -.035em;
  }
  .frase-texto { translate: var(--frase-x, 0) var(--frase-y, 0); transition: transform .15s cubic-bezier(.34, 1.56, .64, 1); }
  .frase-botao:hover:not(:active) .frase-texto, .frase-botao:focus-visible .frase-texto { transform: scale(1.05); }
  @media (prefers-reduced-motion: reduce) {
    .frase-texto { transition: none; }
    .frase-botao:hover:not(:active) .frase-texto, .frase-botao:focus-visible .frase-texto { transform: none; }
  }
  .frase-dica {
    display: block; margin-top: 24px; opacity: 0; transition: opacity .2s ease;
    font: 400 .9rem var(--mono); color: var(--suave);
  }
  .frase-area:hover .frase-dica, .frase-area:focus-within .frase-dica { opacity: 1; }
  @media (hover: none) { .frase-dica, button.lapis { opacity: 1; } }
  .estado-desafio { display: block; margin: 0 0 16px; }
  .bilhete-corpo { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(24px, 4vw, 64px) 0; }
  .titulo-problema {
    font-size: clamp(1.8rem, 5.5vw, 5.5rem); font-weight: 800; line-height: 1.05;
    letter-spacing: -.03em; margin: 0; overflow-wrap: anywhere;
  }
  .bilhete.girando .bilhete-corpo { align-items: stretch; padding: 0; }
  .maquina {
    flex: 1; display: flex; flex-direction: column;
  }
  .rolo { position: relative; flex: 1; min-height: 240px; overflow: hidden; }
  .rolo > div:first-child { position: absolute; inset: 0 0 auto; will-change: transform; }
  .rolo::before { content: ""; position: absolute; left: 0; right: 0; top: 33.33%; bottom: 33.33%; border-block: 1px solid transparent; pointer-events: none; z-index: 1; }
  .simbolo {
    height: var(--item); display: flex; align-items: center; justify-content: flex-start; text-align: left;
    overflow: hidden; overflow-wrap: anywhere;
    font-size: max(1.15rem, min(clamp(1.8rem, 5.5vw, 5.5rem), calc(var(--item) * .32))); font-weight: 800; line-height: 1.1; letter-spacing: -.02em;
  }
  .maquina.ganhou .rolo::before { border-color: var(--tinta); }
  .maquina.ganhou .simbolo:not(.vencedor) { opacity: .2; }
  .blocos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px clamp(24px, 4vw, 56px); margin-top: clamp(20px, 3vw, 40px); }
  .bloco p { margin: 2px 0 0; font-size: clamp(1rem, 1.3vw, 1.25rem); overflow-wrap: anywhere; }
  .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(24px, 3vw, 40px); }

  button {
    font: 800 1rem var(--titulo); cursor: pointer; border-radius: 8px; padding: 12px 20px;
    border: 1px solid var(--linha); background: transparent; color: var(--tinta);
  }
  button:hover:not(:disabled) { background: var(--linha); }
  button:disabled { opacity: .5; cursor: default; }
  button.principal { background: var(--destaque); border-color: var(--destaque); color: var(--sobre-destaque); }
  button.principal:hover:not(:disabled) { background: var(--destaque); opacity: .85; }
  button.grande { font-size: 1.2rem; padding: 16px 32px; }
  button.discreto { border-color: transparent; color: var(--suave); padding: 12px; font-weight: 500; }
  button.mini { min-height: 36px; font: 500 .8rem var(--mono); padding: 4px 8px; border: 1px solid var(--linha); color: var(--suave); border-radius: 6px; flex: none; }
  button { transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), background-color .15s ease, opacity .15s ease; }
  button:active:not(:disabled) { transform: scale(.95); transition-duration: .08s; }

  /* Transições entre telas (View Transitions). */
  ::view-transition { pointer-events: none; }
  :root[data-transicao="subir"]::view-transition-old(root),
  :root[data-transicao="subir"]::view-transition-new(root) { mix-blend-mode: normal; }
  :root[data-transicao="subir"]::view-transition-old(root) { animation: sair-subindo .4s cubic-bezier(.4, 0, .2, 1) both; }
  :root[data-transicao="subir"]::view-transition-new(root) { animation: entrar-subindo .4s cubic-bezier(.2, .8, .2, 1) both; }
  :root[data-transicao="revelar"]::view-transition-old(root) { animation: sumir .2s ease both; }
  :root[data-transicao="revelar"]::view-transition-new(root) { animation: surgir .35s .15s cubic-bezier(.2, .8, .2, 1) both; }
  :root[data-transicao="suave"]::view-transition-group(root) { animation-duration: .25s; }
  ::view-transition-group(titulo-sorteado) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  ::view-transition-old(titulo-sorteado), ::view-transition-new(titulo-sorteado) { animation-duration: .45s; height: 100%; object-fit: none; object-position: left center; }
  @keyframes sair-subindo { to { transform: translateY(-30vh); opacity: 0; } }
  @keyframes entrar-subindo { from { transform: translateY(100vh); } }
  @keyframes sumir { to { opacity: 0; } }
  @keyframes surgir { from { opacity: 0; transform: translateY(12px); } }
  @keyframes aparecer { from { opacity: 0; } }

  dialog[open], #painel-filtros:popover-open, .mais[open] .coluna, .extra details[open] > :not(summary) { animation: surgir .2s ease-out; }
  dialog[open]::backdrop { animation: aparecer .2s ease-out; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active:not(:disabled) { transform: none; }
    dialog[open], dialog[open]::backdrop, #painel-filtros:popover-open, .mais[open] .coluna, .extra details[open] > :not(summary) { animation: none; }
  }
  :focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }

  .aviso { color: var(--destaque); margin: 14px 0 0; }

  section.extra {
    margin: 40px clamp(16px, 2.5vw, 32px) 0;
  }
  ul.lista { list-style: none; margin: 0; padding: 0; }
  ul.lista li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linha); }
  .lista-titulo { overflow-wrap: anywhere; }
  .lista-meta { font: 400 .78rem var(--mono); color: var(--suave); }
  .lista-meta.resolvido { color: var(--ok); }
  .vazio { color: var(--suave); margin: 0; }
  a { color: var(--tinta); }

  details summary { cursor: pointer; font-weight: 800; font-size: 1.25rem; }
  form.novo { display: grid; gap: 12px; margin-top: 16px; }
  .mais { margin-top: 20px; }
  .mais summary { font-size: 1rem; }
  .coluna { display: grid; gap: 18px; max-width: 68ch; margin-top: 20px; }
  .coluna h3 { font-size: 1rem; font-weight: 800; margin: 10px 0 0; }
  .mais ul { margin: 2px 0 0; padding-left: 20px; }
  .mais .nota { color: var(--suave); font-size: .9rem; }

  dialog {
    background: var(--solido); color: var(--tinta); border: 0; border-radius: 14px;
    padding: 24px; width: min(440px, calc(100vw - 32px));
    box-shadow: 0 20px 50px var(--sombra);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog p { margin: 0 0 16px; }

  @media (max-width: 460px) {
    .acoes button { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<main>
  <div class="palco">
    <header class="cabecalho">
      <h1 id="titulo"></h1>
    </header>

    <article class="bilhete" id="bilhete" aria-live="polite"></article>

    <div id="painel-filtros" popover>
      <label><span class="rotulo">Área</span><select id="filtro-area"></select></label>
      <p id="contagem"></p>
    </div>
  </div>

  <section class="extra">
    <h2>Histórico</h2>
    <p class="vazio" id="historico-vazio">Nenhum problema encarado ainda.</p>
    <ul class="lista" id="historico"></ul>
  </section>

  <section class="extra">
    <details>
      <summary>Adicionar meu próprio problema</summary>
      <form class="novo" id="form-novo">
        <label><span class="rotulo">Problema, em uma frase</span><input name="titulo" required maxlength="120"></label>
        <label><span class="rotulo">Quem sofre com isso</span><input name="quem" required maxlength="120"></label>
        <label><span class="rotulo">Como é a dor hoje</span><textarea name="dor" required maxlength="400"></textarea></label>
        <label><span class="rotulo">Menor primeira versão</span><textarea name="mvp" required maxlength="400"></textarea></label>
        <label><span class="rotulo">Área</span><input name="area" required maxlength="40" list="areas"></label>
        <datalist id="areas"></datalist>
        <div><button type="submit">Colocar no sorteio</button></div>
      </form>
      <ul class="lista" id="proprios" style="margin-top:20px"></ul>
    </details>
  </section>
</main>

<dialog id="dialogo-resolvi">
  <form method="dialog" id="form-resolvi">
    <h2>Problema resolvido!</h2>
    <label><span class="rotulo">Link do app (opcional)</span>
      <input type="url" name="link" placeholder="https://"></label>
    <div class="acoes">
      <button class="principal" value="ok">Registrar</button>
      <button class="discreto" value="cancelar" formnovalidate>Ainda não</button>
    </div>
  </form>
</dialog>

<dialog id="dialogo-desistir">
  <form method="dialog">
    <h2>Desistir deste problema?</h2>
    <p>Ele vai para o histórico e não será sorteado de novo.</p>
    <div class="acoes">
      <button value="ok">Desistir</button>
      <button class="principal" value="cancelar" autofocus>Continuar tentando</button>
    </div>
  </form>
</dialog>

const BANCO = [
  {"id":"caixa-antes-do-recebimento","num":1,"area":"Finanças e precificação","titulo":"O caixa acaba antes de entrar o próximo recebimento","quem":"MEIs e micro e pequenas empresas com contas fixas e entradas irregulares.","dor":"O dono percebe tarde que os recebimentos previstos não cobrirão as contas que vencem na mesma semana.","mvp":"Cadastro manual de saldo, contas a pagar, recebimentos esperados e vencimentos; previsão de 30 dias e alerta de caixa negativo. Sem conexão bancária.","impacto":"Atrasos, juros e risco de interromper a operação.","evidencia":"Em julho de 2026, 9,2 milhões de empresas estavam negativadas; 8,7 milhões eram MPEs. A Serasa descreve caixa apertado como parte do cenário, mas não atribui cada atraso à falta de previsão.","nivelEvidencia":"Quantitativa direta para inadimplência; indireta para a causa operacional.","comoResolvem":"O Sebrae recomenda planilhas de fluxo de caixa e registros de entradas e saídas; não mede quantas empresas usam planilha.","quemPagaria":"Dono de MEI ou pequeno negócio; contador poderia indicar a ferramenta para vários clientes.","hipotese":"Uma previsão simples de saldo negativo, feita antes do vencimento, vale assinatura se evitar atrasos ou horas de conferência.","fontes":[{"titulo":"Inadimplência das empresas em julho de 2026","url":"https://www.serasaexperian.com.br/sala-de-imprensa/indicadores/inadimplencia-chegou-a-9-milhoes-de-empresas-em-julho-e-dividas-somaram-238-bilhoes-revela-serasa-experian/"},{"titulo":"Planejamento financeiro e fluxo de caixa para pequenos negócios","url":"https://meuatendimento.sebrae.com.br/sites/PortalSebrae/artigos/como-fazer-a-gestao-financeira-do-pequeno-negocio%2Cd999a442d2e5a410VgnVCM1000003b74010aRCRD"}]},
  {"id":"cobranca-de-recebiveis","num":2,"area":"Finanças e precificação","titulo":"Recebíveis vencidos ficam sem acompanhamento de cobrança","quem":"Prestadores B2B, oficinas, pequenas distribuidoras e empresas que vendem a prazo.","dor":"Faturas, parcelas e promessas de pagamento podem ficar espalhadas por mensagens, planilhas e extratos.","mvp":"Importar CSV ou cadastrar faturas; agrupar por vencimento, cliente e valor; criar lembrete e registrar contato/pagamento.","impacto":"Capital de giro retido e tempo gasto cobrando manualmente.","evidencia":"O Sebrae lista contas a receber como controle essencial para pequenos negócios. É evidência de relevância gerencial, não uma pesquisa sobre quantos atrasam cobranças.","nivelEvidencia":"Indireta, baseada em orientação operacional.","comoResolvem":"Planilhas, agenda e contato individual são alternativas plausíveis; a frequência de cada método não foi medida na fonte.","quemPagaria":"Negócio que emite várias cobranças por mês ou escritório contábil com carteira de clientes.","hipotese":"Uma fila de cobranças com lembretes e histórico reduzirá atrasos e esforço sem automatizar mensagens sensíveis.","fontes":[{"titulo":"Controles financeiros essenciais para pequenos negócios","url":"https://bibliotecas.sebrae.com.br/chronus/ARQUIVOS_CHRONUS/bds/bds.nsf/47A3FD6ADC6D190203257140006C9B68/$File/NT00031F3A.pdf"}]},
  {"id":"conciliacao-pix-cartao-caixa","num":3,"area":"Finanças e precificação","titulo":"O fechamento diário não bate com Pix, cartão e dinheiro","quem":"Lojas, salões, restaurantes e negócios com vários meios de pagamento.","dor":"O total vendido, os comprovantes e os valores efetivamente repassados podem exigir conferência em lugares diferentes.","mvp":"Importação CSV de vendas e repasses, associação manual por data/valor e lista de divergências; começar sem integração bancária.","impacto":"Horas de fechamento e diferenças de caixa difíceis de localizar.","evidencia":"O Sebrae reportou que 97% dos pequenos negócios aceitavam Pix na 8ª Pesquisa Pulso; um guia do Sebrae recomenda conferência diária do caixa. Nenhuma dessas fontes mede divergências de conciliação.","nivelEvidencia":"Contextual direta para adoção de Pix; indireta para divergências.","comoResolvem":"Extratos bancários, relatórios da maquininha e fechamento manual são os registros indicados pelo contexto; a fonte não compara métodos usados.","quemPagaria":"Comércio ou serviço com vários caixas/maquininhas e fechamento frequente.","hipotese":"Importar relatórios simples e destacar diferenças poupa tempo suficiente para justificar cobrança mensal.","fontes":[{"titulo":"Pesquisa Pulso dos Pequenos Negócios — 8ª edição","url":"https://sebraepr.com.br/impulsiona/pesquisa-pulso-dos-pequenos-negocios-8a-edicao/"},{"titulo":"Controles financeiros essenciais para pequenos negócios","url":"https://bibliotecas.sebrae.com.br/chronus/ARQUIVOS_CHRONUS/bds/bds.nsf/47A3FD6ADC6D190203257140006C9B68/$File/NT00031F3A.pdf"}]},
  {"id":"separacao-caixa-pessoal-empresa","num":4,"area":"Finanças e precificação","titulo":"Despesas pessoais e dinheiro da empresa se misturam","quem":"MEIs e donos de negócios familiares que usam a mesma conta para despesas pessoais e da empresa.","dor":"Fica difícil saber quanto o negócio realmente faturou, gastou ou pode retirar sem comprometer pagamentos.","mvp":"Registro manual de entradas e saídas com etiquetas pessoal/empresa, retirada do dono e resumo mensal; sem movimentar dinheiro.","impacto":"Decisões ruins de retirada e baixa visibilidade da saúde financeira.","evidencia":"O Sebrae orienta separar recursos do negócio das despesas particulares como passo inicial da gestão financeira; a página não mede a proporção que mistura os recursos.","nivelEvidencia":"Indireta, baseada em orientação oficial.","comoResolvem":"A recomendação publicada é separar contas e registrar retiradas; o comportamento atual dos MEIs não foi quantificado nessa fonte.","quemPagaria":"MEI que precisa organizar retiradas mensais ou contador que orienta clientes iniciantes.","hipotese":"Uma separação visual simples entre pessoal e empresa será mais fácil de manter que duas planilhas independentes.","fontes":[{"titulo":"Como fazer a gestão financeira do pequeno negócio","url":"https://meuatendimento.sebrae.com.br/sites/PortalSebrae/artigos/como-fazer-a-gestao-financeira-do-pequeno-negocio%2Cd999a442d2e5a410VgnVCM1000003b74010aRCRD"}]},
  {"id":"repasse-de-custos-ao-preco","num":5,"area":"Finanças e precificação","titulo":"Os custos sobem, mas o preço de venda fica defasado","quem":"MEIs, lojas e pequenos negócios de alimentação que compram insumos ou mercadorias recorrentes.","dor":"A empresa absorve aumentos de custo e pode vender sem perceber que a margem diminuiu.","mvp":"Calculadora por produto/serviço: insumos, taxas e mão de obra manuais; custo total, margem estimada e comparação de cenários.","impacto":"Margem e lucro menores por produto ou serviço.","evidencia":"Na 8ª Pesquisa Pulso, 70% relataram aumento de custos nos 30 dias anteriores, mas apenas 9% disseram conseguir repassar o aumento aos clientes.","nivelEvidencia":"Quantitativa direta, nacional; não prova que falha de cálculo seja a causa.","comoResolvem":"A pesquisa não descreve o método de precificação. Planilha, calculadora, fornecedor e contador são práticas a verificar por segmento.","quemPagaria":"Negócio com catálogo repetido e custos variáveis, se o cálculo mostrar margem recuperável.","hipotese":"Atualizar custos e testar cenários de preço por produto será mais simples que refazer planilhas manualmente.","fontes":[{"titulo":"Pesquisa Pulso dos Pequenos Negócios — 8ª edição","url":"https://sebraepr.com.br/impulsiona/pesquisa-pulso-dos-pequenos-negocios-8a-edicao/"}]},
  {"id":"captacao-de-novos-clientes-mei","num":6,"area":"Vendas e canais digitais","titulo":"O MEI tem dificuldade para atrair novos clientes","quem":"Microempreendedores individuais e prestadores locais que fazem a própria divulgação.","dor":"Conseguir contatos qualificados e transformar divulgação em conversas comerciais compete com o trabalho de entrega.","mvp":"Cadastro simples de oferta, canal, lead e próximo passo; lembrete de retorno e painel manual de contatos convertidos.","impacto":"Menos oportunidades e receita instável.","evidencia":"Na Sondagem Econômica MEI de maio de 2025, 21% apontaram dificuldade para divulgar, vender ou se comunicar com clientes como obstáculo.","nivelEvidencia":"Quantitativa direta para a dificuldade geral de venda/divulgação.","comoResolvem":"A 9ª Pesquisa Pulso informa que 7 em cada 10 negócios usam redes sociais e internet para vender; não mede o retorno de cada canal.","quemPagaria":"Profissional autônomo ou MEI que consiga atribuir novos contatos a uma rotina comercial útil.","hipotese":"Um app com plano semanal de divulgação, contatos e origem do lead gerará clientes suficientes para ser pago.","fontes":[{"titulo":"Sondagem Econômica MEI — Principais desafios","url":"https://sebraepr.com.br/impulsiona/meis-em-foco-os-desafios-reais-de-quem-empreende-no-brasil/"},{"titulo":"Pesquisa Pulso dos Pequenos Negócios — 9ª edição","url":"https://sebraepr.com.br/impulsiona/pesquisa-pulso-dos-pequenos-negocios-9a-edicao/"}]},
  {"id":"retorno-de-orcamentos-em-canais","num":7,"area":"Vendas e canais digitais","titulo":"Orçamentos enviados em conversas ficam sem próximo passo","quem":"Técnicos, salões, oficinas, fotógrafos e prestadores que cotam pelo WhatsApp ou redes sociais.","dor":"O profissional precisa lembrar quem recebeu orçamento, quando retornar e qual foi o combinado.","mvp":"Lista de orçamento com cliente, serviço, valor, estado, validade e lembrete; botão para abrir a conversa existente, sem disparo automático.","impacto":"Tempo perdido e possível venda que esfria.","evidencia":"O Sebrae encontrou dificuldade de venda/comunicação entre 21% dos MEIs e forte uso de canais digitais; a pesquisa não mede orçamentos esquecidos. Evidência indireta para esse fluxo específico.","nivelEvidencia":"Indireta, derivada de dificuldade comercial geral e uso digital.","comoResolvem":"A organização entre conversas, agenda e anotações não foi medida; esses métodos devem ser checados em entrevistas.","quemPagaria":"Prestador que envia vários orçamentos por semana e perde o controle dos retornos.","hipotese":"Um quadro de orçamentos e lembretes reduz esquecimentos sem exigir CRM complexo.","fontes":[{"titulo":"Sondagem Econômica MEI — Principais desafios","url":"https://sebraepr.com.br/impulsiona/meis-em-foco-os-desafios-reais-de-quem-empreende-no-brasil/"},{"titulo":"Pesquisa Pulso dos Pequenos Negócios — 9ª edição","url":"https://sebraepr.com.br/impulsiona/pesquisa-pulso-dos-pequenos-negocios-9a-edicao/"}]},
  {"id":"reativacao-de-clientes-de-servico","num":8,"area":"Vendas e canais digitais","titulo":"Serviços recorrentes não lembram o cliente na hora da próxima visita","quem":"Oficinas, barbearias, salões, clínicas veterinárias e manutenção residencial.","dor":"A próxima revisão ou retorno depende da memória do profissional e do cliente; o contato pode não acontecer.","mvp":"Ficha mínima de cliente, data/serviço anterior, intervalo definido pelo negócio e lembrete para o profissional convidar o cliente a retornar.","impacto":"Menos recorrência e agenda com espaços vazios.","evidencia":"As fontes consultadas mostram dificuldade geral de venda e comunicação entre MEIs, mas não medem recompra perdida nem frequência de retorno. Evidência indireta.","nivelEvidencia":"Indireta; segmento e frequência precisam de validação própria.","comoResolvem":"Agenda, ficha de cliente ou mensagens futuras são possibilidades a investigar; a pesquisa não documenta a prática.","quemPagaria":"Negócio com ciclos previsíveis de revisão ou manutenção e valor por cliente recorrente.","hipotese":"Lembretes consentidos e histórico de serviço aumentam retornos o suficiente para justificar pagamento.","fontes":[{"titulo":"Sondagem Econômica MEI — Principais desafios","url":"https://sebraepr.com.br/impulsiona/meis-em-foco-os-desafios-reais-de-quem-empreende-no-brasil/"}]},
  {"id":"catalogo-digital-desatualizado","num":9,"area":"Vendas e canais digitais","titulo":"Catálogos, serviços e preços ficam diferentes entre canais","quem":"Pequenas lojas e prestadores que divulgam ofertas em redes sociais, WhatsApp e plataformas.","dor":"Atualizar manualmente informações em vários lugares consome tempo e pode deixar preço ou disponibilidade inconsistentes.","mvp":"Cadastro central de produtos/serviços e disponibilidade, histórico de atualização e texto copiável para publicar nos canais.","impacto":"Retrabalho, dúvidas e risco de perder confiança ou pedidos.","evidencia":"O Sebrae informa que 7 em cada 10 pequenos negócios vendem pela internet ou redes sociais; a pesquisa não mediu inconsistência de catálogo. Evidência de adoção, indireta para a dor.","nivelEvidencia":"Contextual/indireta.","comoResolvem":"Publicações e listas manuais nos canais; a frequência de divergências não foi pesquisada.","quemPagaria":"Loja com catálogo de itens recorrentes e mais de um canal de venda.","hipotese":"Uma fonte única de preço/disponibilidade, com exportação simples, reduz erros sem exigir integração às plataformas.","fontes":[{"titulo":"Pesquisa Pulso dos Pequenos Negócios — 9ª edição","url":"https://sebraepr.com.br/impulsiona/pesquisa-pulso-dos-pequenos-negocios-9a-edicao/"}]},
  {"id":"reposicao-antes-da-ruptura","num":10,"area":"Varejo e estoque","titulo":"Itens importantes acabam antes da próxima reposição","quem":"Mercadinhos, lojas de bairro, autopeças e pequenos varejistas com estoque físico.","dor":"Sem enxergar saída e prazo do fornecedor juntos, o negócio pode perceber a falta de um item só quando o cliente procura.","mvp":"Cadastro de itens, saldo, vendas manuais, prazo do fornecedor e limite mínimo; lista diária de compra sugerida para revisão humana.","impacto":"Venda perdida e compra emergencial mais cara.","evidencia":"O Sebrae classifica controle de estoque e informação para reposição como controles essenciais; não mede a frequência de ruptura em pequenas lojas.","nivelEvidencia":"Indireta, baseada em guia de gestão.","comoResolvem":"Contagem física e planilhas/sistemas de estoque são práticas possíveis; a fonte não informa a participação de cada uma.","quemPagaria":"Varejista com produtos de giro rápido e fornecedor com prazo de entrega previsível.","hipotese":"Alertas baseados em estoque mínimo e prazo de compra evitam faltas suficientes para pagar a ferramenta.","fontes":[{"titulo":"Controles financeiros essenciais para pequenos negócios","url":"https://bibliotecas.sebrae.com.br/chronus/ARQUIVOS_CHRONUS/bds/bds.nsf/47A3FD6ADC6D190203257140006C9B68/$File/NT00031F3A.pdf"}]},
  {"id":"estoque-parado-capital-preso","num":11,"area":"Varejo e estoque","titulo":"Produtos parados prendem capital e espaço de venda","quem":"Pequenos varejistas, lojas de moda, bazares e mercados com muitos SKUs.","dor":"Itens de pouca saída continuam ocupando espaço e dinheiro que poderia financiar produtos mais procurados.","mvp":"Importar CSV de produtos e vendas; classificar giro, dias sem venda e valor em estoque; criar lista de itens para revisão.","impacto":"Capital imobilizado, armazenagem e risco de obsolescência.","evidencia":"O guia do Sebrae inclui reduzir produtos parados entre os objetivos do controle de estoque; não informa prevalência nem valor perdido.","nivelEvidencia":"Indireta, orientação operacional.","comoResolvem":"Inventário e relatórios de venda permitem localizar itens lentos; frequência e precisão desses controles não foram medidas.","quemPagaria":"Loja que financia estoque próprio e sente pressão de caixa.","hipotese":"Um painel de giro e dias sem venda ajuda a decidir reposição, promoção ou descontinuação.","fontes":[{"titulo":"Controles financeiros essenciais para pequenos negócios","url":"https://bibliotecas.sebrae.com.br/chronus/ARQUIVOS_CHRONUS/bds/bds.nsf/47A3FD6ADC6D190203257140006C9B68/$File/NT00031F3A.pdf"}]},
  {"id":"perdas-por-secao-supermercado","num":12,"area":"Varejo e estoque","titulo":"O supermercado não localiza em qual seção crescem as perdas","quem":"Supermercados independentes e redes regionais com setores de perecíveis, açougue e mercearia.","dor":"Perdas e ineficiência podem ser percebidas no resultado total, sem indicação rápida de setor ou causa para investigar.","mvp":"Entrada manual/CSV de vendas, estoque inicial/final e perdas por seção; comparação semanal e lista de desvios para conferência.","impacto":"Margem perdida e correções tardias.","evidencia":"Na pesquisa de eficiência operacional ABRAS 2026, 29,76% das empresas aumentaram receita, mas também viram a ineficiência crescer; 45,95% cresceram reduzindo perdas. É evidência setorial direta, não prova de uma causa única.","nivelEvidencia":"Quantitativa setorial direta.","comoResolvem":"A pesquisa mede indicadores de eficiência; não descreve os sistemas internos usados por cada supermercado.","quemPagaria":"Gerente ou dono de supermercado com vários departamentos e dados de venda/estoque.","hipotese":"Um painel simples por seção aponta onde auditar antes de comprar um sistema de gestão caro.","fontes":[{"titulo":"Pesquisa de Eficiência Operacional ABRAS 2026","url":"https://www.abras.com.br/economia-e-pesquisa/pesquisa-de-eficiencia-operacional/pesquisa-2026"}]},
  {"id":"divergencia-entrega-fornecedor","num":13,"area":"Varejo e estoque","titulo":"A quantidade recebida não confere com o pedido ou a nota","quem":"Pequenos mercados, restaurantes, oficinas e lojas que recebem mercadorias de vários fornecedores.","dor":"Diferenças de quantidade, item ou preço podem passar sem registro no recebimento e só aparecer no inventário ou na fatura.","mvp":"Cadastro/importação simples de pedido e itens; checklist de recebimento por quantidade e preço; exportação de divergências com foto.","impacto":"Pagamento indevido, ruptura e tempo de retrabalho.","evidencia":"O Sebrae recomenda controles de estoque, compras e caixa para pequenas empresas; a fonte não mede divergências de entrega. Evidência indireta de necessidade de controle.","nivelEvidencia":"Indireta; a taxa de divergência não foi encontrada.","comoResolvem":"Conferência visual, canhoto e nota fiscal são fluxos plausíveis, mas a fonte não documenta a prática média.","quemPagaria":"Negócio que recebe mercadoria várias vezes por semana e paga por conferência manual.","hipotese":"Um registro rápido de divergência por pedido reduz perdas e facilita contestar a cobrança.","fontes":[{"titulo":"Controles financeiros essenciais para pequenos negócios","url":"https://bibliotecas.sebrae.com.br/chronus/ARQUIVOS_CHRONUS/bds/bds.nsf/47A3FD6ADC6D190203257140006C9B68/$File/NT00031F3A.pdf"}]},
  {"id":"vales-conciliacao-taxas","num":14,"area":"Alimentação fora do lar","titulo":"Taxas e repasses de vale-alimentação não fecham com as vendas","quem":"Bares, restaurantes e lanchonetes que recebem VA/VR por várias maquininhas ou bandeiras.","dor":"Mudanças de regras, taxas e trilhos de pagamento dificultam saber qual vale foi aceito e qual repasse esperar.","mvp":"Importar CSV de vendas e repasses, classificar bandeira/taxa, comparar valor esperado e recebido e sinalizar divergências.","impacto":"Taxas maiores, conciliação manual e caixa imprevisível.","evidencia":"A Abrasel relata taxas de 6%–7% em auxílio-alimentação, sistemas ainda não integrados e transações que podem ser processadas como débito/crédito. Evidência setorial direta, publicada em outubro de 2026.","nivelEvidencia":"Setorial direta; não quantifica quantos estabelecimentos têm divergência.","comoResolvem":"Conferência de maquininha, operadora e extrato; a notícia descreve a falta de integração, não mede cada rotina local.","quemPagaria":"Restaurante com volume relevante de vales e conferência manual frequente.","hipotese":"Um conciliador independente de relatórios mostra taxas e repasses divergentes sem exigir integração com operadoras.","fontes":[{"titulo":"Interoperabilidade de vales sem sistemas integrados","url":"https://abrasel.com.br/noticias/noticias/interoperabilidade-de-vales-comeca-em-7-de-novembro-sem-sistemas-integrados/"}]},
  {"id":"simulacao-cbs-restaurante","num":15,"area":"Alimentação fora do lar","titulo":"O restaurante não consegue simular a transição tributária no preço","quem":"Bares, restaurantes e negócios de alimentação fora do lar que precisam rever custo e preço em 2027.","dor":"Mudanças na referência de CBS/IBS dificultam estimar o impacto no custo final antes de atualizar cardápio e orçamento.","mvp":"Calculadora de cenários com parâmetros editáveis, data de vigência, memória de cálculo e aviso de validação com contador.","impacto":"Preço, margem e planejamento tributário.","evidencia":"Em outubro de 2026, a Abrasel informou referência de CBS de 11,35% e preocupação do setor com custos; a alíquota ainda podia ser revista. Evidência setorial e temporal, não medição de perda por estabelecimento.","nivelEvidencia":"Setorial direta; parâmetros regulatórios sujeitos a atualização.","comoResolvem":"A notícia descreve empresários refazendo contas e consultando orientação tributária; não compara ferramentas usadas.","quemPagaria":"Restaurante pequeno que atualiza cardápio ou contador que atende estabelecimentos do setor.","hipotese":"Um simulador transparente e atualizado poupa consultorias repetidas e ajuda a testar cenários, sem substituir contador.","fontes":[{"titulo":"CBS amplia pressão de custos sobre bares e restaurantes","url":"https://abrasel.com.br/noticias/noticias/aliquota-da-cbs-amplia-a-pressao-de-custos-sobre-bares-e-restaurantes/"}]},
  {"id":"cardapio-atrasado-inflacao","num":16,"area":"Alimentação fora do lar","titulo":"O preço do cardápio não acompanha a inflação dos custos","quem":"Restaurantes, padarias, cafés e lanchonetes que alteram insumos com frequência.","dor":"Adiar reajustes ou recalcular item por item pode deixar o cardápio atrás da inflação e da mudança nos insumos.","mvp":"Cadastro de ingredientes/custo por prato, histórico de preços, alerta de variação e comparação do preço atual com margem estimada.","impacto":"Margem e lucro por prato.","evidencia":"Na pesquisa Abrasel divulgada em outubro de 2026, 60% dos estabelecimentos não tinham acompanhado a inflação nos preços do cardápio; 38% não reajustaram e 22% reajustaram abaixo dela.","nivelEvidencia":"Quantitativa setorial direta.","comoResolvem":"A fonte descreve reajustes de cardápio, mas não como são calculados; planilhas e fichas técnicas precisam ser validadas com os restaurantes.","quemPagaria":"Dono de restaurante com cardápio recorrente e variação de insumos.","hipotese":"Atualizar custos e destacar itens com preço defasado facilita reajustes e compensa uma assinatura baixa.","fontes":[{"titulo":"Pesquisa Abrasel sobre escala, custos e resultados do setor","url":"https://abrasel.com.br/noticias/noticias/fim-da-escala-6x1-vai-tirar-5-9-milhoes-de-horas-semanais-de-trabalho-de-bares-e-restaurantes/"}]},
  {"id":"lucro-liquido-por-delivery","num":17,"area":"Alimentação fora do lar","titulo":"Mais pedidos de delivery não significam mais lucro","quem":"Restaurantes que vendem em mais de uma plataforma ou participam de campanhas promocionais.","dor":"Volume de pedidos pode crescer sem deixar claro o efeito de ingredientes, embalagens e estrutura sobre o resultado de cada canal.","mvp":"Importar pedidos CSV, incluir taxas e embalagem, estimar contribuição por canal e comparar semanas; sem integração a marketplaces.","impacto":"Margem e custo de operação.","evidencia":"A Abrasel relata que maior faturamento por delivery não vira automaticamente mais lucro e cita ingredientes, embalagens e mudanças na operação como fatores a considerar. Evidência setorial/caso, não estimativa nacional de perda.","nivelEvidencia":"Setorial direta; problema econômico descrito, frequência não quantificada.","comoResolvem":"O exemplo citado ajustou equipe e cozinha; a fonte recomenda analisar rentabilidade por canal, mas não mede ferramentas usadas.","quemPagaria":"Restaurante com vendas em múltiplas plataformas e custo variável por pedido.","hipotese":"Um cálculo por canal/ produto revela promoções que vendem muito mas contribuem pouco.","fontes":[{"titulo":"Concorrência no delivery aumenta com avanço de plataformas","url":"https://abrasel.com.br/noticias/noticias/concorrencia-no-delivery-aumenta-com-avanco-de-plataformas-pelo-interior/"}]},
  {"id":"picos-de-pedidos-expedicao","num":18,"area":"Alimentação fora do lar","titulo":"Promoções de delivery geram picos que travam a expedição","quem":"Restaurantes que recebem muitos pedidos em campanhas, cupons ou horários concentrados.","dor":"A cozinha e a expedição precisam absorver picos sem atrasar pedidos de salão nem reduzir qualidade.","mvp":"Entrada manual de pedidos por canal, tempo estimado e capacidade por estação; fila por prioridade e alerta de sobrecarga.","impacto":"Atraso, cancelamento, retrabalho e experiência ruim.","evidencia":"A Abrasel descreve um restaurante que transferiu funcionários para expedição/produção e comprou equipamento após aumento de pedidos por cupons. É um caso real, não prova de prevalência nacional.","nivelEvidencia":"Setorial direta, caso individual.","comoResolvem":"No caso publicado, o restaurante reorganizou funções e ampliou estrutura física; a frequência em outros estabelecimentos não foi medida.","quemPagaria":"Restaurante com picos previsíveis e pedidos em múltiplos canais.","hipotese":"Um painel de fila e capacidade permite limitar promoções ou reforçar equipe antes de atrasos.","fontes":[{"titulo":"Concorrência no delivery aumenta com avanço de plataformas","url":"https://abrasel.com.br/noticias/noticias/concorrencia-no-delivery-aumenta-com-avanco-de-plataformas-pelo-interior/"}]},
  {"id":"visibilidade-de-lucro-restaurante","num":19,"area":"Alimentação fora do lar","titulo":"O restaurante não distingue lucro, empate e prejuízo no mês","quem":"Bares e restaurantes independentes com custos de pessoal, aluguel e insumos variáveis.","dor":"A receita de vendas pode mascarar um mês no zero a zero ou no prejuízo se os custos não forem vistos junto com o faturamento.","mvp":"Registro de vendas e despesas por semana, categorias editáveis e resultado estimado; deixar claro que não é contabilidade oficial.","impacto":"Decisões tardias de preço, escala e compras.","evidencia":"A pesquisa Abrasel citada em outubro de 2026 registrou 40% dos estabelecimentos com lucro em agosto, 40% no zero a zero e 19% no prejuízo. Não mediu falta de ferramentas gerenciais.","nivelEvidencia":"Quantitativa setorial direta para o resultado; indireta para a causa.","comoResolvem":"A fonte relata pesquisas mensais de faturamento e lucro; método individual de apuração não foi informado.","quemPagaria":"Restaurante que não tem equipe financeira dedicada e quer acompanhar resultado semanal.","hipotese":"Um resumo de resultado simples, atualizado manualmente em poucos minutos, ajuda a decidir antes do fim do mês.","fontes":[{"titulo":"Pesquisa Abrasel sobre escala, custos e resultados do setor","url":"https://abrasel.com.br/noticias/noticias/fim-da-escala-6x1-vai-tirar-5-9-milhoes-de-horas-semanais-de-trabalho-de-bares-e-restaurantes/"}]},

const CHAVE = "sorteio-de-problemas";
const estadoInicial = () => ({ ativo: null, historico: [], vistos: [], proprios: [], proximoNum: BANCO.length + 1 });

function carregar() {
  try {
    return { ...estadoInicial(), ...JSON.parse(localStorage.getItem(CHAVE)) };
  } catch {
    return estadoInicial();
  }
}

function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(estado));
  } catch {
    // Sem armazenamento (janela privada, por exemplo), o app segue funcionando até fechar.
  }
}

const estado = carregar();
let sorteado = null;
let girando = false;
let aviso = "";

const $ = (id) => document.getElementById(id);
const reduzMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, props = {}, ...filhos) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  n.append(...filhos);
  return n;
}

const todos = () => [...BANCO, ...estado.proprios];
const dataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR");

function poolFiltrado() {
  const area = $("filtro-area").value;
  const encerrados = new Set(estado.historico.map((h) => h.problema.id));
  return todos().filter((p) => !encerrados.has(p.id) && (!area || p.area === area));
}

function escolher() {
  const pool = poolFiltrado();
  if (!pool.length) return null;
  // Evita repetir até dar a volta em todos os problemas disponíveis.
  let opcoes = pool.filter((p) => !estado.vistos.includes(p.id) && p.id !== sorteado?.id);
  if (!opcoes.length) {
    const ids = new Set(pool.map((p) => p.id));
    estado.vistos = estado.vistos.filter((id) => !ids.has(id));
    opcoes = pool.length > 1 ? pool.filter((p) => p.id !== sorteado?.id) : pool;
  }
  const p = opcoes[Math.floor(Math.random() * opcoes.length)];
  estado.vistos.push(p.id);
  salvar();
  return p;
}

// Sem suporte do navegador ou com movimento reduzido, a tela só troca direto.
function transicao(tipo, atualizar) {
  if (!document.startViewTransition || reduzMovimento) {
    atualizar();
    return null;
  }
  const raiz = document.documentElement;
  raiz.dataset.transicao = tipo;
  const t = document.startViewTransition(atualizar);
  t.finished.finally(() => {
    if (raiz.dataset.transicao === tipo) delete raiz.dataset.transicao;
  });
  return t;
}

function sortear() {
  if (girando) return;
  const escolhido = escolher();
  if (!escolhido) {
    sorteado = null;
    aviso = "Nenhum problema disponível com esses filtros.";
    renderBilhete();
    return;
  }
  aviso = "";
  somInicio();
  if (reduzMovimento) {
    sorteado = escolhido;
    renderBilhete();
    return;
  }

  girando = true;
  transicao("subir", () => girarMaquina(escolhido));
}

let audio = null;

function tocar(frequencia, duracao, volume, tipo, atraso = 0) {
  audio ??= new AudioContext();
  audio.resume();
  const inicio = audio.currentTime + atraso;
  const osc = audio.createOscillator();
  const ganho = audio.createGain();
  osc.type = tipo;
  osc.frequency.value = frequencia;
  ganho.gain.setValueAtTime(volume, inicio);
  ganho.gain.exponentialRampToValueAtTime(.001, inicio + duracao);
  osc.connect(ganho).connect(audio.destination);
  osc.start(inicio);
  osc.stop(inicio + duracao);
}

function somInicio() {
  tocar(440, .12, .15, "triangle");
  tocar(660, .18, .15, "triangle", .07);
}

const somTique = () => tocar(1800, .03, .12, "triangle");

function somPremio() {
  tocar(880, .25, .15, "sine");
  tocar(1320, .4, .15, "sine", .12);
}

// Toca um tique a cada problema que entra na faixa central, acompanhando a velocidade do rolo.
function tiquesDoGiro(fita, altura, animacao) {
  let ultimo = 0;
  const conferir = () => {
    if (animacao.playState !== "running") return;
    const y = new DOMMatrixReadOnly(getComputedStyle(fita).transform).m42;
    const atual = Math.round(-y / altura);
    if (atual > ultimo) {
      ultimo = atual;
      somTique();
    }
    requestAnimationFrame(conferir);
  };
  conferir();
}

function criarFita(pool, voltas, final) {
  // Evita títulos iguais em sequência, inclusive logo antes e logo depois do sorteado.
  const proximo = (...evitar) => {
    const opcoes = pool.filter((p) => !evitar.includes(p));
    const lista = opcoes.length ? opcoes : pool;
    return lista[Math.floor(Math.random() * lista.length)];
  };
  const itens = [];
  for (let i = 0; i < voltas; i++) {
    itens.push(proximo(itens[i - 1], i === voltas - 1 ? final : null));
  }
  // O sorteado para na linha do meio, com um vizinho abaixo dele.
  itens.push(final, proximo(final));
  return el("div", {}, ...itens.map((p) => el("div", { className: "simbolo", textContent: p.titulo })));
}

function girarMaquina(escolhido) {
  const voltas = 45;
  const fita = criarFita(poolFiltrado(), voltas, escolhido);
  const rolo = el("div", { className: "rolo" }, fita);
  const maquina = el("div", { className: "maquina" }, rolo);

  const b = $("bilhete");
  b.setAttribute("aria-busy", "true");
  b.classList.add("em-branco", "girando");
  b.replaceChildren(el("div", { className: "bilhete-corpo" }, maquina));

  const altura = rolo.clientHeight / 3;
  maquina.style.setProperty("--item", altura + "px");
  const posicao = (itens) => `translateY(${-itens * altura}px)`;
  // Começa rápido e vai freando aos poucos até parar.
  const animacao = fita.animate([
    { transform: posicao(0), easing: "cubic-bezier(.2, .6, .6, 1)" },
    { transform: posicao(voltas - 1 + .18), offset: .97, easing: "ease-in-out" },
    { transform: posicao(voltas - 1) },
  ], { duration: 12000, fill: "forwards" });
  tiquesDoGiro(fita, altura, animacao);

  animacao.finished.then(() => {
    somPremio();
    maquina.classList.add("ganhou");
    fita.children[voltas].classList.add("vencedor");
    setTimeout(() => {
      // O nome vencedor se transforma no título do cartão.
      fita.children[voltas].style.viewTransitionName = "titulo-sorteado";
      let titulo = null;
      const t = transicao("revelar", () => {
        girando = false;
        sorteado = escolhido;
        renderBilhete();
        titulo = $("bilhete").querySelector(".titulo-problema");
        titulo.style.viewTransitionName = "titulo-sorteado";
      });
      t?.finished.finally(() => { titulo.style.viewTransitionName = ""; });
      if (!t) titulo.style.viewTransitionName = "";
    }, 1000);
  });
}

const bloco = (rotulo, texto) => el("div", { className: "bloco" }, el("span", { className: "rotulo", textContent: rotulo }), el("p", { textContent: texto }));

function detalhes(p) {
  return [
    el("h2", { className: "titulo-problema", textContent: p.titulo }),
    el("div", { className: "blocos" },
      bloco("Quem sofre", p.quem),
      bloco("A dor", p.dor),
      bloco("Primeira versão do app", p.mvp)),
  ];
}

function evidencias(p) {
  if (!p.evidencia) return "";
  const fontes = (p.fontes || []).map((f) => {
    const href = linkSeguro(f.url);
    return el("li", {}, href ? el("a", { href, target: "_blank", rel: "noopener noreferrer", textContent: f.titulo }) : f.titulo);
  });
  return el("details", { className: "mais" },
    el("summary", { textContent: "Evidências e fontes" }),
    el("div", { className: "coluna" },
      bloco("Impacto", p.impacto),
      bloco("Evidência da dor", p.evidencia),
      bloco("Nível de evidência", p.nivelEvidencia),
      bloco("Como resolvem hoje", p.comoResolvem),
      el("div", { className: "bloco" }, el("span", { className: "rotulo", textContent: "Fontes" }), el("ul", {}, ...fontes)),
      el("h3", { textContent: "Hipóteses a validar" }),
      bloco("Quem pagaria (hipótese)", p.quemPagaria),
      bloco("Hipótese de demanda", p.hipotese),
      el("p", { className: "nota", textContent: NOTA_EVIDENCIA })));
}

function botao(texto, classe, aoClicar) {
  return el("button", { type: "button", className: classe, textContent: texto, onclick: aoClicar });
}

function botaoLapis() {
  const ligado = !!$("filtro-area").value;
  const rotulo = ligado ? "Editar filtros (1 ativo)" : "Editar filtros";
  const b = el("button", { type: "button", id: "filtros", className: "lapis" + (ligado ? " ligado" : ""), title: rotulo });
  b.setAttribute("aria-label", rotulo);
  b.setAttribute("popovertarget", "painel-filtros");
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  return b;
}

function renderBilhete() {
  const b = $("bilhete");
  b.removeAttribute("aria-busy");
  const ativo = estado.ativo;
  const qtd = poolFiltrado().length;
  b.classList.remove("girando");
  b.classList.toggle("em-branco", !ativo && !sorteado);
  $("titulo").replaceChildren(ativo ? "Este é o seu problema" : botao("Qual o seu problema?", "titulo-link", voltarAoInicio));
  $("contagem").textContent = qtd === 1 ? "1 problema na urna" : qtd + " problemas na urna";

  if (ativo) {
    const dias = Math.floor((Date.now() - new Date(ativo.inicio)) / 86400000);
    const tempo = dias === 0 ? "começou hoje" : dias === 1 ? "há 1 dia" : "há " + dias + " dias";
    b.replaceChildren(
      el("div", { className: "bilhete-corpo" },
        el("span", { className: "rotulo estado-desafio", textContent: "Em andamento, " + tempo }),
        ...detalhes(ativo.problema),
        el("div", { className: "acoes" },
          botao("Resolvi!", "principal grande", () => $("dialogo-resolvi").showModal()),
          botao("Desistir", "discreto", () => $("dialogo-desistir").showModal())),
        evidencias(ativo.problema)),
    );
    return;
  }

  if (sorteado) {
    b.replaceChildren(
      el("div", { className: "bilhete-corpo" }, ...detalhes(sorteado),
        el("div", { className: "acoes" },
          botao("Aceitar o desafio", "principal grande", aceitar),
          botao("Sortear outro", "", sortear)),
        evidencias(sorteado)),
    );
    return;
  }

  b.replaceChildren(
    el("div", { className: "bilhete-corpo" },
      el("div", { className: "frase-area" },
        el("h2", { className: "frase" },
          el("button", { type: "button", className: "frase-botao", onclick: sortear },
            el("span", { className: "frase-texto", textContent: "Qual o seu problema?" }),
            el("span", { className: "frase-dica", textContent: "Clique para descobrir o seu problema" }))),
        botaoLapis()),
      aviso ? el("p", { className: "aviso", textContent: aviso }) : ""),
  );
}

function voltarAoInicio() {
  if (girando || !sorteado) return;
  sorteado = null;
  aviso = "";
  transicao("suave", renderBilhete);
}

function aceitar() {
  // A tela só troca no quadro seguinte: ignora um segundo clique ou um clique durante o giro.
  if (girando || !sorteado) return;
  estado.ativo = { problema: sorteado, inicio: new Date().toISOString() };
  sorteado = null;
  salvar();
  transicao("suave", renderBilhete);
}

function encerrar(status, link) {
  estado.historico.unshift({ problema: estado.ativo.problema, status, inicio: estado.ativo.inicio, fim: new Date().toISOString(), link });
  estado.ativo = null;
  salvar();
  transicao("suave", renderTudo);
}

function linkSeguro(texto) {
  try {
    const url = new URL(texto);
    return ["http:", "https:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function renderHistorico() {
  $("historico-vazio").hidden = estado.historico.length > 0;
  $("historico").replaceChildren(...estado.historico.map((h) => {
    const resolvido = h.status === "resolvido";
    const texto = (resolvido ? "resolvido em " : "desistiu em ") + dataCurta(h.fim);
    const href = h.link && linkSeguro(h.link);
    return el("li", {},
      el("div", {},
        el("div", { className: "lista-titulo", textContent: h.problema.titulo }),
        el("div", { className: "lista-meta" + (resolvido ? " resolvido" : ""), textContent: texto },
          href ? " · " : "",
          href ? el("a", { href, target: "_blank", rel: "noopener noreferrer", textContent: "ver app" }) : "")));
  }));
}

function renderProprios() {
  $("proprios").replaceChildren(...estado.proprios.map((p) => el("li", {},
    el("div", { className: "lista-titulo", textContent: p.titulo }),
    estado.ativo?.problema.id === p.id ? "" : botao("remover", "mini", () => {
      estado.proprios = estado.proprios.filter((x) => x.id !== p.id);
      if (sorteado?.id === p.id) sorteado = null;
      salvar();
      renderTudo();
    }))));
}

function preencher(select, opcoes, rotuloTodos) {
  const atual = select.value;
  select.replaceChildren(
    ...(rotuloTodos ? [el("option", { value: "", textContent: rotuloTodos })] : []),
    ...opcoes.map((o) => el("option", { value: o, textContent: o })));
  if (opcoes.includes(atual)) select.value = atual;
}

function renderFiltros() {
  const areas = [...new Set(todos().map((p) => p.area))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  preencher($("filtro-area"), areas, "Todas");
  $("areas").replaceChildren(...areas.map((a) => el("option", { value: a })));
}

function renderTudo() {
  renderFiltros();
  renderBilhete();
  renderHistorico();
  renderProprios();
}

// Abre o painel logo abaixo do lápis, sem sair da tela.
$("painel-filtros").addEventListener("beforetoggle", (e) => {
  if (e.newState !== "open") return;
  const lapis = $("filtros").getBoundingClientRect();
  const largura = Math.min(340, innerWidth - 32);
  const esquerda = Math.max(16, Math.min(lapis.left + lapis.width / 2 - largura / 2, innerWidth - largura - 16));
  e.target.style.inset = `${lapis.bottom + 8}px auto auto ${esquerda}px`;
});

$("filtro-area").addEventListener("change", () => {
  if (girando) return;
  sorteado = null;
  aviso = "";
  renderBilhete();
});

$("dialogo-resolvi").addEventListener("close", () => {
  const d = $("dialogo-resolvi");
  const link = linkSeguro($("form-resolvi").link.value.trim());
  if (d.returnValue === "ok") encerrar("resolvido", link);
  $("form-resolvi").reset();
  d.returnValue = "";
});

$("dialogo-desistir").addEventListener("close", () => {
  const d = $("dialogo-desistir");
  if (d.returnValue === "ok") encerrar("desistiu", "");
  d.returnValue = "";
});

$("form-novo").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const v = (nome) => f.get(nome).trim();
  estado.proprios.push({
    id: "p" + estado.proximoNum, num: estado.proximoNum,
    titulo: v("titulo"), quem: v("quem"), dor: v("dor"), mvp: v("mvp"), area: v("area"),
  });
  estado.proximoNum++;
  salvar();
  e.target.reset();
  renderTudo();
});

// A frase da tela inicial acompanha o mouse, com atraso suave e deslocamento limitado.
if (!reduzMovimento) {
  const alvo = { x: 0, y: 0 };
  const atual = { x: 0, y: 0 };
  let quadro = 0;
  let anterior = 0;

  const mover = (agora) => {
    const passo = Math.min((agora - anterior) / 1000, .1);
    anterior = agora;
    const suavidade = 1 - Math.exp(-passo * 6);
    atual.x += (alvo.x - atual.x) * suavidade;
    atual.y += (alvo.y - atual.y) * suavidade;
    const raiz = document.documentElement.style;
    raiz.setProperty("--frase-x", atual.x.toFixed(2) + "px");
    raiz.setProperty("--frase-y", atual.y.toFixed(2) + "px");
    const parado = Math.abs(alvo.x - atual.x) < .05 && Math.abs(alvo.y - atual.y) < .05;
    quadro = parado ? 0 : requestAnimationFrame(mover);
  };

  const mirar = (x, y) => {
    alvo.x = x;
    alvo.y = y;
    if (quadro) return;
    anterior = performance.now();
    quadro = requestAnimationFrame(mover);
  };

  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    mirar((e.clientX / innerWidth * 2 - 1) * 28, (e.clientY / innerHeight * 2 - 1) * 12);
  });
  document.documentElement.addEventListener("mouseleave", () => mirar(0, 0));
}

renderTudo();
</script>
